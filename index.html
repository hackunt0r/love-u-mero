<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1530">
<title>نرجع ولا انساك ؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2a1530;
    --bg2:#4a2142;
    --bg3:#7a3350;
    --rose:#ff8fab;
    --rose-soft:#ffc2d1;
    --gold:#f6d6a8;
    --cream:#fff4ee;
    --glass:rgba(255,255,255,.08);
    --glass-b:rgba(255,255,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden}
  body{
    font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(1200px 800px at 15% 10%, #6b2d5c 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 90%, #8c3b55 0%, transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
  }

  /* ===== الخلفية ===== */
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  .orb{
    position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;
    animation:drift 18s ease-in-out infinite alternate;
  }
  .o1{width:42vmax;height:42vmax;background:#ff7aa2;top:-14vmax;left:-10vmax}
  .o2{width:36vmax;height:36vmax;background:#c77dff;bottom:-14vmax;right:-8vmax;animation-delay:-6s;opacity:.35}
  .o3{width:26vmax;height:26vmax;background:#ffb88c;top:40%;left:55%;animation-delay:-11s;opacity:.25}
  @keyframes drift{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(4vmax,3vmax,0) scale(1.12)}
  }
  .vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(20,6,25,.55) 100%);
  }

  /* ===== المسرح ===== */
  .stage{
    position:fixed;inset:0;z-index:3;
    display:flex;justify-content:center;align-items:flex-start;
    padding:clamp(60px,12vh,140px) 20px 24px;
    overflow:hidden;
  }

  .card{
    position:relative;
    display:flex;flex-direction:column;align-items:center;
    width:min(680px,100%);
    min-height:clamp(380px,56vh,540px);
    text-align:center;
    padding:clamp(28px,5vw,48px) clamp(20px,4vw,44px) clamp(26px,4vw,40px);
    border-radius:32px;
    background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
    border:1px solid var(--glass-b);
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.04) inset,
      0 0 90px -30px rgba(255,143,171,.55);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;
    transition:opacity .6s ease,transform .6s ease,filter .6s ease;
  }
  .card.out{opacity:0;transform:translateY(-24px) scale(.96);filter:blur(6px);pointer-events:none}
  @keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}

  .heart-badge{
    width:64px;height:64px;margin:-76px auto 18px;
    display:grid;place-items:center;border-radius:50%;
    font-size:30px;color:#fff;
    background:radial-gradient(circle at 30% 25%,#ffb3c6,#ff6b95 70%);
    box-shadow:0 10px 30px -6px rgba(255,107,149,.7),0 0 0 6px rgba(255,255,255,.07);
    animation:beat 1.8s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.1)}70%{transform:scale(1)}}

  .eyebrow{
    font-size:clamp(.82rem,2.4vw,.95rem);letter-spacing:.12em;
    color:var(--gold);opacity:.9;margin-bottom:10px;
  }
  h1{
    font-family:'Amiri','Cairo',serif;font-weight:700;
    font-size:clamp(2rem,7.2vw,3.5rem);line-height:1.35;
    background:linear-gradient(120deg,#fff 10%,var(--rose-soft) 55%,var(--gold) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,143,171,.25);
    margin-bottom:8px;
  }
  .divider{
    display:flex;align-items:center;gap:12px;justify-content:center;
    color:var(--rose-soft);opacity:.8;margin:12px auto 26px;width:70%;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,194,209,.7),transparent)}

  .actions{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin:auto 0}

  button{font-family:inherit;cursor:pointer;border:0;outline:0}
  .btn{
    position:relative;min-width:140px;padding:15px 34px;
    font-size:clamp(1.05rem,3.6vw,1.25rem);font-weight:700;
    border-radius:999px;color:#fff;letter-spacing:.02em;
    transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  .yes{
    background:linear-gradient(135deg,#ff6b95,#ff8fab 55%,#ffb38a);
    box-shadow:0 14px 34px -10px rgba(255,107,149,.85),0 0 0 1px rgba(255,255,255,.25) inset;
    animation:glow 2.4s ease-in-out infinite;
  }
  .yes:hover{transform:translateY(-3px) scale(1.06);filter:brightness(1.07)}
  .yes:active{transform:scale(.97)}
  .yes::after{
    content:"";position:absolute;inset:-6px;border-radius:inherit;
    border:1px solid rgba(255,179,198,.55);animation:ping 2.4s ease-out infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 14px 34px -10px rgba(255,107,149,.85),0 0 0 1px rgba(255,255,255,.25) inset}50%{box-shadow:0 18px 46px -8px rgba(255,107,149,1),0 0 0 1px rgba(255,255,255,.35) inset}}
  @keyframes ping{0%{transform:scale(.96);opacity:.9}100%{transform:scale(1.22);opacity:0}}

  #slot{display:inline-block}
  .no{
    background:var(--glass);
    border:1px solid var(--glass-b);
    color:var(--cream);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 26px -12px rgba(0,0,0,.6);
    z-index:20;
    transition:left .42s cubic-bezier(.22,1.2,.36,1),top .42s cubic-bezier(.22,1.2,.36,1),transform .42s ease;
  }
  .no.flying{position:absolute;margin:0}

  .hint{
    min-height:1.6em;margin-top:22px;font-size:.95rem;color:var(--rose-soft);
    opacity:.85;transition:opacity .3s ease;
  }

  /* ===== شاشة الاحتفال ===== */
  .win{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;text-align:center;
    padding:clamp(60px,18vh,200px) 24px 24px;
    opacity:0;pointer-events:none;transition:opacity .8s ease;
  }
  .win.show{opacity:1;pointer-events:auto}
  .win .big-heart{
    font-size:clamp(70px,16vw,120px);line-height:1;
    background:linear-gradient(135deg,#ff6b95,#ffb38a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 10px 40px rgba(255,107,149,.8));
    transform:scale(0);
  }
  .win.show .big-heart{animation:pop 1.1s .15s cubic-bezier(.2,1.6,.4,1) forwards,beat 1.8s 1.3s ease-in-out infinite}
  @keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
  .win h2{
    font-family:'Amiri','Cairo',serif;font-weight:700;
    font-size:clamp(2.1rem,8.5vw,4.4rem);line-height:1.3;margin-top:10px;
    background:linear-gradient(120deg,#fff,var(--rose-soft) 50%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:translateY(20px);
  }
  .win p{
    font-family:'Amiri','Cairo',serif;
    font-size:clamp(1.4rem,5.4vw,2.4rem);margin-top:14px;color:var(--cream);
    opacity:0;transform:translateY(20px);text-shadow:0 0 30px rgba(255,143,171,.5);
  }
  .win .sub{font-family:'Cairo',sans-serif;font-size:clamp(.95rem,3vw,1.1rem);color:var(--gold);margin-top:18px}
  .win.show h2{animation:up .9s .7s ease forwards}
  .win.show p{animation:up .9s 1.4s ease forwards}
  .win.show .sub{animation:up .9s 2.1s ease forwards}
  @keyframes up{to{opacity:1;transform:none}}
  .again{
    margin-top:30px;padding:10px 22px;font-size:.9rem;border-radius:999px;
    background:var(--glass);border:1px solid var(--glass-b);color:var(--cream);opacity:0;
    transition:background .25s ease;
  }
  .win.show .again{animation:up .9s 3s ease forwards}
  .again:hover{background:rgba(255,255,255,.16)}

  @media (max-height:560px){
    .stage{padding-top:20px}
    .heart-badge{margin-top:-60px;width:52px;height:52px;font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<main class="stage">
  <section class="card" id="card">
    <div class="heart-badge" aria-hidden="true">♥</div>
    <p class="eyebrow">سؤال واحد بس</p>
    <h1 id="q">نرجع ولا انساك ؟</h1>
    <div class="divider" aria-hidden="true">✦</div>
    <div class="actions">
      <button class="btn yes" id="yes" type="button">نرجع</button>
      <span id="slot"><button class="btn no" id="no" type="button">انساني</button></span>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>
</main>

<section class="win" id="win" aria-live="polite">
  <div class="big-heart" aria-hidden="true">♥</div>
  <h2>كنت عارف</h2>
  <p>دا كده كده يقلبي 🤍</p>
  <span class="sub">وأنا كمان مش هنسى، ولا هسيبك تبعدي مني</span>
  <button class="again" id="again" type="button">من الأول</button>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const card = $('card'), yes = $('yes'), no = $('no'), slot = $('slot'),
        hint = $('hint'), win = $('win'), q = $('q');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     1) زرار "انساني" بيهرب بشكل عشوائي وبعيد
  ========================================================= */
  const taunts = [
    'مش هتلحقه 🙈', 'حاول تاني 🤍', 'هو مش عايز يتضغط', 'قرّب كمان.. هيهرب برضو',
    'الزرار التاني أحلى 😉', 'مفيش فايدة', 'انساني دي مش بتتضغط أصلاً', 'كفاية، اضغط نرجع',
    'قلبك عارف الإجابة', 'هههه قربت.. بس لأ'
  ];
  let flying = false, locked = false, count = 0;
  let mouse = { x: -9999, y: -9999 };

  const rnd = (a, b) => a + Math.random() * (b - a);

  function startFlying() {
    if (flying) return;
    const r = no.getBoundingClientRect();
    const c = card.getBoundingClientRect();
    slot.style.width = r.width + 'px';
    slot.style.height = r.height + 'px';
    no.style.transition = 'none';
    no.classList.add('flying');
    no.style.left = (r.left - c.left - card.clientLeft) + 'px';
    no.style.top = (r.top - c.top - card.clientTop) + 'px';
    no.style.width = r.width + 'px';
    void no.offsetWidth;                // force reflow
    no.style.transition = '';
    flying = true;
  }

  function flee(fromX, fromY) {
    if (locked) return;
    locked = true;
    setTimeout(() => (locked = false), 260);
    startFlying();

    // كل الإحداثيات نسبةً للويندو (الكارت) عشان الزرار يفضل جواه
    const r = no.getBoundingClientRect();
    const c = card.getBoundingClientRect();
    const ox = c.left + card.clientLeft, oy = c.top + card.clientTop;
    const w = r.width, h = r.height, m = 14;
    const vw = card.clientWidth, vh = card.clientHeight;
    const cx = r.left - ox + w / 2, cy = r.top - oy + h / 2;
    fromX -= ox; fromY -= oy;
    const maxX = Math.max(m, vw - w - m), maxY = Math.max(m, vh - h - m);

    // مناطق ممنوع يهبط عليها: زرار نرجع + السؤال + العنوان الصغير
    const avoid = [yes, q, document.querySelector('.eyebrow'), document.querySelector('.heart-badge')].map(el => {
      const b = el.getBoundingClientRect(), p = 18;
      return { l: b.left - ox - p, r: b.right - ox + p, t: b.top - oy - p, b: b.bottom - oy + p };
    });
    const hits = (x, y) => avoid.some(a => x < a.r && x + w > a.l && y < a.b && y + h > a.t);

    const minJump = Math.min(Math.max(vw, vh) * 0.55, 420);   // بُعد كبير في كل مرة
    const minPtr  = Math.min(Math.max(vw, vh) * 0.4, 320);
    let best = null, bestScore = -1;

    for (let i = 0; i < 90; i++) {
      const x = rnd(m, maxX), y = rnd(m, maxY);
      if (hits(x, y)) continue;
      const px = x + w / 2, py = y + h / 2;
      const dCur = Math.hypot(px - cx, py - cy);
      const dPtr = Math.hypot(px - fromX, py - fromY);
      const score = Math.min(dCur / minJump, dPtr / minPtr) + Math.random() * 0.25;
      if (score > bestScore) { bestScore = score; best = { x, y }; }
      if (dCur >= minJump && dPtr >= minPtr && Math.random() < 0.35) { best = { x, y }; break; }
    }
    if (!best) best = { x: cx < vw / 2 ? maxX : m, y: cy < vh / 2 ? maxY : m };

    no.style.left = best.x + 'px';
    no.style.top = best.y + 'px';
    no.style.transform = `rotate(${rnd(-14, 14).toFixed(1)}deg) scale(${rnd(.92, 1.05).toFixed(2)})`;

    count++;
    hint.textContent = taunts[(count - 1) % taunts.length];
  }

  const fromEvent = e => {
    const p = e.touches && e.touches[0] ? e.touches[0] : e;
    return [p.clientX ?? mouse.x, p.clientY ?? mouse.y];
  };

  no.addEventListener('pointerenter', e => flee(...fromEvent(e)));
  no.addEventListener('mouseenter', e => flee(...fromEvent(e)));
  no.addEventListener('pointerdown', e => { e.preventDefault(); flee(...fromEvent(e)); });
  no.addEventListener('touchstart', e => { e.preventDefault(); flee(...fromEvent(e)); }, { passive: false });
  no.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); flee(...fromEvent(e)); });
  no.addEventListener('focus', () => { no.blur(); const r = no.getBoundingClientRect(); flee(r.left + r.width / 2, r.top + r.height / 2); });

  // هروب استباقي قبل ما المؤشر يلمس الزرار أصلاً
  addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (e.pointerType === 'touch') return;
    const r = no.getBoundingClientRect();
    const near = 90;
    if (e.clientX > r.left - near && e.clientX < r.right + near &&
        e.clientY > r.top - near && e.clientY < r.bottom + near) {
      flee(e.clientX, e.clientY);
    }
  });

  addEventListener('resize', () => {
    if (!flying) return;
    const r = no.getBoundingClientRect();
    const c = card.getBoundingClientRect();
    const x = r.left - c.left - card.clientLeft, y = r.top - c.top - card.clientTop;
    no.style.left = Math.min(Math.max(14, x), Math.max(14, card.clientWidth - r.width - 14)) + 'px';
    no.style.top  = Math.min(Math.max(14, y), Math.max(14, card.clientHeight - r.height - 14)) + 'px';
  });

  /* =========================================================
     2) الجسيمات: بتلات هادية في الخلفية + احتفال
  ========================================================= */
  const cv = $('fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);
  function sizeCanvas() {
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  sizeCanvas(); addEventListener('resize', sizeCanvas);

  const palette = ['#ff8fab', '#ffc2d1', '#ffb38a', '#f6d6a8', '#ffffff', '#c77dff', '#ff6b95'];
  const pick = a => a[(Math.random() * a.length) | 0];
  let petals = [], bursts = [], celebrating = false;

  const petalCount = () => reduce ? 12 : Math.min(46, Math.round(W / 34));
  function newPetal(initial) {
    const heart = Math.random() < 0.35;
    return {
      x: rnd(0, W), y: initial ? rnd(-H, H) : rnd(-60, -10),
      s: heart ? rnd(9, 18) : rnd(7, 14),
      vy: rnd(.35, .95), vx: rnd(-.25, .25),
      sw: rnd(.6, 1.6), ph: rnd(0, 6.28), rot: rnd(0, 6.28), vr: rnd(-.02, .02),
      a: rnd(.25, .65), heart, c: pick(palette)
    };
  }
  for (let i = 0; i < petalCount(); i++) petals.push(newPetal(true));

  function drawHeart(x, y, s, c, a, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a;
    ctx.fillStyle = c; ctx.beginPath();
    const t = s / 2;
    ctx.moveTo(0, t * .9);
    ctx.bezierCurveTo(-t * 2, -t * .2, -t * .9, -t * 1.7, 0, -t * .6);
    ctx.bezierCurveTo(t * .9, -t * 1.7, t * 2, -t * .2, 0, t * .9);
    ctx.fill(); ctx.restore();
  }
  function drawPetal(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = p.a;
    ctx.fillStyle = p.c; ctx.beginPath();
    ctx.ellipse(0, 0, p.s * .55, p.s, 0, 0, 6.283); ctx.fill(); ctx.restore();
  }

  // احتفال
  function burstConfetti(x, y, n = 70) {
    for (let i = 0; i < n; i++) {
      const ang = rnd(0, 6.283), sp = rnd(3, 11);
      bursts.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 3,
        g: .16, life: rnd(90, 170), age: 0, c: pick(palette),
        kind: Math.random() < .45 ? 'heart' : (Math.random() < .5 ? 'rect' : 'dot'),
        s: rnd(6, 14), rot: rnd(0, 6.28), vr: rnd(-.25, .25)
      });
    }
  }
  function firework(x, y) {
    const col = pick(palette), n = 46;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * 6.283, sp = rnd(3.2, 6.4);
      bursts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: .045, life: rnd(55, 85), age: 0, c: col, kind: 'spark', s: 2.4, rot: 0, vr: 0 });
    }
    for (let i = 0; i < 8; i++) {
      const ang = rnd(0, 6.283), sp = rnd(1.5, 4);
      bursts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: .03, life: rnd(70, 110), age: 0, c: '#ff8fab', kind: 'heart', s: rnd(10, 16), rot: rnd(-.5, .5), vr: rnd(-.05, .05) });
    }
  }
  function risingHeart() {
    bursts.push({
      x: rnd(0, W), y: H + 20, vx: rnd(-.5, .5), vy: -rnd(1.6, 3.4), g: -0.002,
      life: rnd(200, 300), age: 0, c: pick(palette), kind: 'heart', s: rnd(12, 26), rot: rnd(-.4, .4), vr: rnd(-.02, .02), soft: true
    });
  }

  let last = performance.now(), spawnT = 0, fwT = 0;
  function frame(now) {
    const dt = Math.min(2.2, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, W, H);

    for (const p of petals) {
      p.ph += .02 * dt;
      p.x += (p.vx + Math.sin(p.ph) * p.sw * .5) * dt;
      p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > H + 30) Object.assign(p, newPetal(false));
      p.heart ? drawHeart(p.x, p.y, p.s, p.c, p.a, p.rot) : drawPetal(p);
    }

    if (celebrating && !reduce) {
      spawnT += dt; fwT += dt;
      if (spawnT > 6) { spawnT = 0; risingHeart(); }
      if (fwT > 55) { fwT = 0; firework(rnd(W * .12, W * .88), rnd(H * .12, H * .5)); }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.age += dt; b.vy += b.g * dt; b.vx *= b.kind === 'spark' ? .985 : .992;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      const k = 1 - b.age / b.life;
      if (k <= 0 || b.y > H + 50 || b.y < -80) { bursts.splice(i, 1); continue; }
      const a = Math.max(0, Math.min(1, k * (b.soft ? .9 : 1.6)));
      if (b.kind === 'heart') drawHeart(b.x, b.y, b.s, b.c, a, b.rot);
      else if (b.kind === 'rect') {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.globalAlpha = a;
        ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
      } else {
        ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = b.c; ctx.shadowColor = b.c; ctx.shadowBlur = b.kind === 'spark' ? 10 : 0;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.s / (b.kind === 'spark' ? 1 : 2.4), 0, 6.283); ctx.fill(); ctx.restore();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* =========================================================
     3) الضغط على "نرجع"
  ========================================================= */
  function celebrate() {
    if (celebrating) return;
    celebrating = true;
    const r = yes.getBoundingClientRect();
    burstConfetti(r.left + r.width / 2, r.top + r.height / 2, 120);
    card.classList.add('out');
    no.style.transition = 'opacity .4s ease'; no.style.opacity = '0'; no.style.pointerEvents = 'none';
    setTimeout(() => {
      win.classList.add('show');
      burstConfetti(W * .25, H * .3, 70);
      burstConfetti(W * .75, H * .3, 70);
      firework(W * .5, H * .22);
    }, 450);
    setTimeout(() => burstConfetti(W / 2, H * .35, 90), 1400);
    setTimeout(() => { firework(W * .2, H * .25); firework(W * .8, H * .25); }, 2000);
  }
  yes.addEventListener('click', celebrate);

  $('again').addEventListener('click', () => {
    celebrating = false; bursts.length = 0;
    win.classList.remove('show');
    card.classList.remove('out');
    no.style.opacity = ''; no.style.pointerEvents = '';
    hint.textContent = ''; count = 0;
  });
})();
</script>
